name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NTL and GMP
        run: sudo apt-get update && sudo apt-get install -y libntl-dev libgmp-dev
      - name: Build
        run: make -j4
      - name: Test (unit + golden + RSA/ElGamal round trips)
        run: make test
      - name: Drafts still do not compile (documented in README)
        run: |
          for d in FDigital Protocolo; do
            if g++ -std=c++17 -fsyntax-only -I$d $d/main.cc 2> $d.err; then
              echo "::warning::$d/main.cc now compiles; update README"
            else
              echo "$d: does not compile (expected); first error:"
              grep -m1 'error' $d.err
            fi
          done
