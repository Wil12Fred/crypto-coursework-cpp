name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libntl-dev libgmp-dev
      - run: make -j4
      - name: smoke-run
        run: |
          echo 4 holamundo | build/ruta
          echo 3 holamundo | build/vaya
          build/enigma
          printf '0\n' | (cd RSA && ../build/rsa)
